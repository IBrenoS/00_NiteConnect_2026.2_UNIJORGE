services:
  - type: web
    name: nite-connect-api
    runtime: docker
    repo: https://github.com/IasminLuise/00_NiteConnect_2026.2_UNIJORGE
    branch: main
    region: virginia
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: nite-connect-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: nite-connect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nite-connect-db
          property: password
